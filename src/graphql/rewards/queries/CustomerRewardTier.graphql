# Mirasvit Rewards: the tier ladder (current tier flagged) and the customer's transactions; pending = not activated yet.
query CustomerRewardTier {
  mstRewardsTiers {
    name
    description
    min_earn_points
    tier_logo
    is_current_tier
  }
  customer {
    mstRewardPointsBalance {
      transactions {
        transaction_id
        code
        comment
        amount
        is_activated
        created_at
      }
    }
  }
}
