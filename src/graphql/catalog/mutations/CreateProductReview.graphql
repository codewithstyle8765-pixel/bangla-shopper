# Create a product review for the specified product.
mutation CreateProductReview($input: CreateProductReviewInput!) {
  createProductReview(input: $input) {
    review {
      average_rating
      created_at
      nickname
      product {
        __typename
        canonical_url
        country_of_manufacture
        gift_message_available
        max_sale_qty
        meta_description
        meta_keyword
        meta_title
        min_sale_qty
        name
        new_from_date
        new_to_date
        only_x_left_in_stock
        options_container
        quantity
        rating_summary
        review_count
        sku
        special_price
        special_to_date
        stock_status
        swatch_image
        uid
        url_key
        url_suffix
      }
      ratings_breakdown {
        name
        value
      }
      summary
      text
    }
  }
}
