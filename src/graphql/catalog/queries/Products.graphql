# Search for products that match the criteria specified in the `search` and `filter` attributes.
query Products($search: String, $filter: ProductAttributeFilterInput, $pageSize: Int, $currentPage: Int, $sort: ProductAttributeSortInput) {
  products(
    search: $search
    filter: $filter
    pageSize: $pageSize
    currentPage: $currentPage
    sort: $sort
  ) {
    aggregations {
      attribute_code
      count
      label
      options {
        count
        label
        value
      }
      position
    }
    items {
      __typename
      canonical_url
      categories {
        __typename
        available_sort_by
        canonical_url
        children_count
        custom_layout_update_file
        default_sort_by
        description
        display_mode
        filter_price_range
        image
        include_in_menu
        is_anchor
        landing_page
        level
        magic_image
        magic_label
        magic_thumbnail
        meta_description
        meta_keywords
        meta_title
        name
        path
        path_in_store
        position
        product_count
        sync_to_facebook_catalog
        uid
        url_key
        url_path
        url_suffix
      }
      country_of_manufacture
      description {
        html
      }
      gift_message_available
      image {
        disabled
        label
        position
        types
        url
      }
      max_sale_qty
      media_gallery {
        __typename
        disabled
        label
        position
        types
        url
      }
      meta_description
      meta_keyword
      meta_title
      min_sale_qty
      name
      new_from_date
      new_to_date
      only_x_left_in_stock
      options_container
      price_tiers {
        quantity
      }
      product_links {
        __typename
        link_type
        linked_product_sku
        linked_product_type
        position
        sku
      }
      quantity
      rating_summary
      review_count
      short_description {
        html
      }
      sku
      small_image {
        disabled
        label
        position
        types
        url
      }
      special_price
      special_to_date
      stock_status
      swatch_image
      thumbnail {
        disabled
        label
        position
        types
        url
      }
      uid
      url_key
      url_rewrites {
        url
      }
      url_suffix
    }
    page_info {
      current_page
      page_size
      total_pages
    }
    sort_fields {
      default
      options {
        label
        value
      }
    }
    suggestions {
      message
      search
      success
    }
    total_count
  }
}
