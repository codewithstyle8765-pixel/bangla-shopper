    description
    dominantColor
    finalPrice
    formattedFinalPrice
    formattedMaxPrice
    formattedMinPrice
    formattedMsrp
    formattedPrice
    formattedSpecialPrice
    groupedData {
      defaultQty
      dominantColor
      foramtedPrice
      id
      isAvailable
      isInRange
      name
      specialPrice
      thumbNail
