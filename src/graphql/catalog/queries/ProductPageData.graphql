        label
        swatchType
        updateProductPreviewImage
      }
      chooseText
      images
      index
      optionPrices {
        product
      }
      productId
      swatchData
      template
    }
    customOptions {
      decorated_is_first
      decorated_is_last
      decorated_is_odd
      default_price
      default_price_type
      default_title
      file_extension
      formatted_default_price
