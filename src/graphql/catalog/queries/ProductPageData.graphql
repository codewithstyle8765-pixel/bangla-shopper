    maxPrice
    message
    minAddToCartQty
    minPrice
    msrp
    msrpDisplayActualPriceType
    msrpEnabled
    name
    price
    priceFormat {
      decimalSymbol
      groupLength
      groupSymbol
      integerRequired
      pattern
      precision
      requiredPrecision
    }
    priceView
    productUrl
    rating
    ratingArray
    ratingData {
      ratingCode
      ratingValue
    }
    ratingFormData {
      id
      name
      values
    }
    relatedProductList {
      arTextureImages
      arType
      arUrl
      availability
      categoryId
      configurableData {
        chooseText
        images
        index
        productId
        swatchData
        template
