# product page all information
query ProductPageData($customerToken: String, $storeId: Int, $productId: Int, $currency: String, $width: String, $quoteId: Int, $sku: String) {
  productPageData(
    customerToken: $customerToken
    storeId: $storeId
    productId: $productId
    currency: $currency
    width: $width
    quoteId: $quoteId
    sku: $sku
