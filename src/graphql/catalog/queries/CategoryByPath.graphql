# Category page header: the category found by its URL path (title, SEO text, banner, breadcrumbs, sub-categories).
query CategoryByPath($urlPath: String!) {
  categoryList(filters: { url_path: { eq: $urlPath } }) {
    uid
    name
    description
    cms_block {
      content
    }
    breadcrumbs {
      category_name
      category_url_path
    }
    children {
      name
      url_path
    }
  }
}
