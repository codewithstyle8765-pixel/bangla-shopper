# Return an array of categories based on the specified filters.
query CategoryList($filters: CategoryFilterInput, $pageSize: Int, $currentPage: Int) {
  categoryList(filters: $filters, pageSize: $pageSize, currentPage: $currentPage) {
    available_sort_by
    breadcrumbs {
      category_level
      category_name
      category_uid
      category_url_key
      category_url_path
    }
    canonical_url
    children_count
    cms_block {
      content
      identifier
      title
    }
    custom_layout_update_file
    default_sort_by
    description
    display_mode
    filter_price_range
    image
    include_in_menu
    is_anchor
    landing_page
    level
    magic_image
    magic_label
    magic_thumbnail
    meta_description
    meta_keywords
    meta_title
    name
    path
    path_in_store
    position
    product_count
    products {
      items {
        __typename
        canonical_url
        country_of_manufacture
        gift_message_available
        max_sale_qty
        meta_description
        meta_keyword
        meta_title
        min_sale_qty
        name
        new_from_date
        new_to_date
        only_x_left_in_stock
        options_container
        quantity
        rating_summary
        review_count
        sku
        special_price
        special_to_date
        stock_status
        swatch_image
        uid
        url_key
        url_suffix
      }
      page_info {
        current_page
        page_size
        total_pages
      }
      total_count
    }
    redirect_code
    relative_url
    sync_to_facebook_catalog
    type
    uid
    url_key
    url_path
    url_suffix
  }
}
