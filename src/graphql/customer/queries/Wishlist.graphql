# wishlist information
query Wishlist($storeId: Int, $pageNumber: Int, $customerToken: String, $currency: String, $width: String) {
  wishlist(
    storeId: $storeId
    pageNumber: $pageNumber
    customerToken: $customerToken
    currency: $currency
    width: $width
  ) {
    message
    success
    totalCount
    wishList {
      arTextureImages
      arType
      arUrl
      availability
      configurableData {
        chooseText
        images
        index
        productId
        swatchData
        template
      }
      description
      dominantColor
      entityId
      finalPrice
      formattedFinalPrice
      formattedMaxPrice
      formattedMinPrice
      formattedPrice
      formattedTierPrice
      groupedPrice
      hasRequiredOptions
      id
      isAvailable
      isInRange
      isInWishlist
      isNew
      items {
        __typename
        added_at
        description
        id
        quantity
      }
      linksPurchasedSeparately
      maxPrice
      minAddToCartQty
      minPrice
      msrpDisplayActualPriceType
      msrpEnabled
      name
      options {
        label
        value
      }
      page_info {
        current_page
        page_size
        total_pages
      }
      price
      priceView
      productId
      qty
      rating
      reviewCount
      sku
      thumbNail
      tierPrice
      typeId
      wishlistItemId
    }
  }
}
