# Retrieves the payment details for the order
query GetPaymentOrder($cartId: String!, $id: String!) {
  getPaymentOrder(cartId: $cartId, id: $id) {
    id
    mp_order_id
    payment_source_details {
      card {
        card_expiry_month
        card_expiry_year
        last_digits
        name
      }
    }
    status
  }
}
